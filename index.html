<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bollywood Showcase</title>

<img src="aditya.jpg.jpeg">

<button onclick="showMovie('aditya')">

</div>

<div class="card">

<img src="aamir.jpg.jpeg">

<button onclick="showMovie('aamir')">
Aamir Khan
</button>

</div>

<div class="card">

<img src="hrithik.jpg.jpeg">

<button onclick="showMovie('hrithik')">
Hrithik Roshan
</button>

</div>

<div class="card">

<img src="kajol.jpg.jpeg">

<button onclick="showMovie('kajol')">
Kajol
</button>

</div>

</section>


<section id="movieSection">

<h2>Latest Release</h2>

<img id="movieImage" src="">

Click any actor above
</h3>

</section>

<script src="script.js"></script>

</html>
