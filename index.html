<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKIT Admission Form</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">
<h1>Swami Keshvanand Institute of Technology,<br>Management & Gramothan, Jaipur</h1>
<p>Online Admission Registration Form</p>
</div>

<form>

<!-- Personal Details -->

<div class="section">

<h2>Personal Details</h2>

<div class="row">

<div class="input-box">
<label>Full Name</label>
<input type="text" placeholder="Enter your full name" required>
</div>

<div class="input-box">
<label>Date of Birth</label>
<input type="date" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Email Address</label>
<input type="email" placeholder="example@gmail.com" required>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" placeholder="10-digit mobile number" required>
</div>

</div>

<div class="row">

<div class="input-box">
<label>Gender</label>

<select required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

</div>

<div class="input-box">

<label>Category</label>

<select required>

<option value="">Select Category</option>
<option>General</option>
<option>OBC</option>
<option>SC</option>
<option>ST</option>
<option>EWS</option>

</select>

</div>

</div>

</div>

<!-- Academic Details -->

<div class="section">

<h2>Academic Details</h2>

<div class="row">

<div class="input-box">
<label>12th Percentage</label>
<input type="number" placeholder="Enter percentage" required>
</div>

<div class="input-box">
<label>Board</label>
<input type="text" placeholder="CBSE / RBSE" required>
</div>

</div>

<div class="row">

<div class="input-box">

<label>Course</label>

<select required>

<option>Select Course</option>
<option>B.Tech CSE</option>
<option>B.Tech CSE (AI)</option>
<option>B.Tech IT</option>
<option>B.Tech ECE</option>
<option>B.Tech Mechanical</option>
<option>B.Tech Civil</option>

</select>

</div>

<div class="input-box">

<label>Admission Type</label>

<select required>

<option>Select Type</option>
<option>REAP</option>
<option>Management Quota</option>

</select>

</div>

</div>

</div>

<!-- Address -->

<div class="section">

<h2>Address</h2>

<label>Permanent Address</label>

<textarea rows="4" placeholder="Enter complete address" required></textarea>

</div>

<!-- Account -->

<div class="section">

<h2>Create Login</h2>

<div class="row">

<div class="input-box">

<label>Password</label>

<input type="password"
placeholder="Create password"
required>

</div>

<div class="input-box">

<label>Confirm Password</label>

<input type="password"
placeholder="Confirm password"
required>

</div>

</div>

</div>

<!-- Declaration -->

<div class="section">

<label class="check">

<input type="checkbox" required>

I hereby declare that the information provided above is true and correct.

</label>

</div>

<button type="submit">
Submit Admission Form
</button>

</form>

</div>

<script>

document.querySelector("form").addEventListener("submit",function(e){

e.preventDefault();

alert("Admission Form Submitted Successfully!\n\nThank you for registering with SKIT Jaipur.");

});

</script>

</body>
</html>
