<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>

<header>

<h1>🌸 Welcome to Swasti's Web Page 🌿</h1>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
</ul>

<button id="darkModeBtn">🌙 Dark Mode</button>

</nav>

</header>


<section class="hero">

<h2>Create • Learn • Grow</h2>

<p>
A beautiful interactive webpage made using HTML, CSS & JavaScript.
</p>

</section>


<section class="form-section">

<h2>Join Our Community</h2>

<form id="myForm">

<input
type="text"
id="name"
placeholder="Enter Your Name">

<div class="error" id="nameError"></div>


<input
type="email"
id="email"
placeholder="Enter Your Email">

<div class="error" id="emailError"></div>

<button type="submit">
Submit
</button>

</form>

</section>



<section class="counter-section">

<h2>Click Counter</h2>

<h1 id="count">0</h1>

<div class="buttons">

<button id="clickBtn">
Click Me
</button>

<button id="resetBtn">
Reset
</button>

</div>

</section>


<footer>

<p>
Made with ❤️ by Swasti
</p>
