<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swasti | Presentation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#6a11cb,#2575fc);
            color:white;
        }

        /* Navbar */
        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 60px;
        }

        nav h2{
            font-size:30px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:30px;
        }

        nav a{
            color:white;
            text-decoration:darksalmon;
            font-weight:bold;
        }

        /* Hero Section */
        .hero{
            display:flex;
            justify-content:space-around;
            align-items:center;
            min-height:85vh;
            padding:40px;
            flex-wrap:wrap;
        }

        .left{
            flex:1;
            min-width:300px;
        }

        .left h1{
            font-size:55px;
            margin-bottom:20px;
        }

        .left p{
            font-size:20px;
            margin-bottom:25px;
            line-height:1.6;
        }

        button{
            padding:15px 35px;
            border:none;
            border-radius:30px;
            background:burlywood;
            color:yellow;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#ffe600;
            transition:.4s;
        }

        .right{
            flex:1;
            display:flex;
            justify-content:center;
            min-width:300px;
        }

        .card{
            width:320px;
            background:white;
            color:black;
            border-radius:20px;
            padding:30px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }

        .card img{
            width:130px;
            border-radius:50%;
            margin-bottom:20px;
        }

        .card h2{
            color:black;
            margin-bottom:10px;
        }

        .card p{
            line-height:1.6;
        }

        footer{
            text-align:center;
            padding:20px;
            background:rgba(0,0,0,.2);
        }
    </style>
</head>
<body>

<nav>
    <h2>Swasti</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">

    <div class="left">
        <h1>Hello, I'm Swasti 👋</h1>

        <p>
            First Year CSE (AI) Student.<br>
            Passionate about Web Development, AI,
            Coding and Creative Design.
        </p>

        <button>Explore More</button>
    </div>

    <div class="right">

        <div class="card">

            <img src="https://via.placeholder.com/130" alt="Profile">

            <h2>Swasti Sharma</h2>

            <p>
                💻 Web Developer<br>
                🤖 AI Enthusiast<br>
                🎨 Creative Designer
            </p>

        </div>

    </div>

</section>

<footer>
    © 2026 | Designed by Swasti ❤️
</footer>

</body>
</html>
